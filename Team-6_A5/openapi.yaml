openapi: 3.0.3
info:
  title: CampusEats Order Service - Assignment 5
  version: 1.1.0
servers:
  - url: http://127.0.0.1:5000
paths:
  /orders:
    options:
      summary: Discover supported methods and CORS policy
      responses:
        '204':
          description: No content
          headers:
            Allow: {schema: {type: string}, example: "GET, POST, OPTIONS"}
    get:
      summary: List orders
      parameters:
        - {$ref: '#/components/parameters/Authorization'}
        - {$ref: '#/components/parameters/Accept'}
        - {name: studentId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
      responses:
        '200':
          description: Matching orders
          headers:
            X-RateLimit-Limit: {schema: {type: integer}}
            X-RateLimit-Remaining: {schema: {type: integer}}
        '401': {$ref: '#/components/responses/Problem401'}
        '406': {$ref: '#/components/responses/Problem406'}
        '429': {$ref: '#/components/responses/Problem429'}
    post:
      summary: Create an order
      parameters:
        - {$ref: '#/components/parameters/Authorization'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/Accept'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Created
          headers:
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
            X-RateLimit-Limit: {schema: {type: integer}}
            X-RateLimit-Remaining: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '406': {$ref: '#/components/responses/Problem406'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
        '503': {$ref: '#/components/responses/Problem503'}
  /orders/{orderId}:
    options:
      summary: Discover supported methods
      responses:
        '204':
          description: No content
          headers: {Allow: {schema: {type: string}, example: "GET, PUT, OPTIONS"}}
    get:
      summary: Get one order
      parameters:
        - {$ref: '#/components/parameters/Authorization'}
        - {$ref: '#/components/parameters/Accept'}
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      responses:
        '200':
          description: Order representation
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
        '304': {description: Not modified}
        '401': {$ref: '#/components/responses/Problem401'}
        '404': {$ref: '#/components/responses/Problem404'}
        '406': {$ref: '#/components/responses/Problem406'}
    put:
      summary: Update order status using optimistic concurrency
      parameters:
        - {$ref: '#/components/parameters/Authorization'}
        - {$ref: '#/components/parameters/Accept'}
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: {status: {$ref: '#/components/schemas/OrderStatus'}}
      responses:
        '200':
          description: Updated order
          headers: {ETag: {schema: {type: string}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '404': {$ref: '#/components/responses/Problem404'}
        '406': {$ref: '#/components/responses/Problem406'}
        '412': {$ref: '#/components/responses/Problem412'}
        '429': {$ref: '#/components/responses/Problem429'}
  /orders/{orderId}/cancellation:
    options:
      summary: Discover supported methods
      responses:
        '204':
          description: No content
          headers: {Allow: {schema: {type: string}, example: "POST, OPTIONS"}}
    post:
      summary: Cancel an order
      parameters:
        - {$ref: '#/components/parameters/Authorization'}
        - {$ref: '#/components/parameters/Accept'}
        - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200':
          description: Cancelled order
          headers: {ETag: {schema: {type: string}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '429': {$ref: '#/components/responses/Problem429'}
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: {type: string, example: "Bearer demo-token"}
    Accept:
      name: Accept
      in: header
      required: false
      schema: {type: string, example: application/json}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
    CreateOrderRequest:
      type: object
      required: [studentId, items, paymentMethod]
      properties:
        studentId: {type: string}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity, unitPrice]
            properties:
              itemId: {type: string}
              quantity: {type: integer, minimum: 1}
              unitPrice: {type: number, minimum: 0}
        paymentMethod: {type: string}
    Order:
      type: object
      required: [orderId, status, total, estimatedReadyMinutes]
      properties:
        orderId: {type: integer}
        status: {$ref: '#/components/schemas/OrderStatus'}
        total: {type: number}
        estimatedReadyMinutes: {type: integer}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    Problem400: {description: Bad request, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem401: {description: Unauthorized, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem404: {description: Not found, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem406: {description: Not acceptable, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem409: {description: Conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem412: {description: Precondition failed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem422: {description: Unprocessable entity, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem429: {description: Too many requests, headers: {Retry-After: {schema: {type: integer}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Problem503: {description: Payment unavailable, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
