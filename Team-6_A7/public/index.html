<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats - Orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CampusEats Orders</h1>
  <p class="sub">Live orders &mdash; data served by GraphQL</p>

  <div id="list">Loading&hellip;</div>

  <form id="addForm">
    <h3>Place a new order</h3>
    <input id="customer" placeholder="Customer name" required>
    <input id="item" placeholder="Item" required>
    <input id="quantity" type="number" min="1" value="1" style="width:80px">
    <input id="total" type="number" step="0.01" placeholder="Total (Rs)" style="width:110px" required>
    <input id="note" placeholder="Note (optional)">
    <button type="submit">Add order</button>
    <div id="msg"></div>
  </form>

  <script>
    const API = 'http://localhost:4000/';

    async function gql(query, variables) {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
      const json = await res.json();
      if (json.errors) throw new Error(json.errors[0].message);
      return json.data;
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // READ: list all orders
    async function load() {
      try {
        const data = await gql(`{ orders { id customer item quantity total status note } }`);
        const rows = data.orders.map(o => `
          <tr>
            <td>#${o.id}</td>
            <td>${esc(o.customer)}</td>
            <td>${esc(o.item)} &times; ${o.quantity}</td>
            <td>Rs ${Number(o.total).toFixed(2)}</td>
            <td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td>
            <td>${esc(o.note)}</td>
          </tr>`).join('');
        document.getElementById('list').innerHTML = `
          <table>
            <tr><th>ID</th><th>Customer</th><th>Item</th><th>Total</th><th>Status</th><th>Note</th></tr>
            ${rows}
          </table>`;
      } catch (err) {
        document.getElementById('list').textContent = 'Could not load orders: ' + err.message;
      }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = {
        customer: document.getElementById('customer').value,
        item: document.getElementById('item').value,
        quantity: Number(document.getElementById('quantity').value) || 1,
        total: Number(document.getElementById('total').value),
        note: document.getElementById('note').value || null,
      };
      try {
        const data = await gql(
          `mutation($input: AddOrderInput!) { addOrder(input: $input) { id customer item } }`,
          { input }
        );
        document.getElementById('msg').textContent = `Order #${data.addOrder.id} added for ${data.addOrder.customer}`;
        e.target.reset();
        document.getElementById('quantity').value = 1;
        load();
      } catch (err) {
        document.getElementById('msg').textContent = 'Error: ' + err.message;
      }
    });

    load();
  </script>
</body>
</html>
