<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusEats Orders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>CampusEats orders</h1>
    <p class="sub">Live from <code>GET /orders</code></p>
  </header>

  <main>
    <section class="panel" aria-labelledby="list-title">
      <div class="panel-head">
        <h2 id="list-title">All orders</h2>
        <span id="count" class="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Customer</th>
              <th>Item</th>
              <th class="num">Qty</th>
              <th class="num">Price</th>
              <th class="num">Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="7" class="empty">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add an order</h2>
      <form id="order-form" novalidate>
        <label>Customer
          <input name="customer" type="text" placeholder="e.g. Meera Joshi" required />
        </label>
        <label>Item
          <input name="item" type="text" placeholder="e.g. Veg Biryani" required />
        </label>
        <label>Quantity
          <input name="quantity" type="number" min="1" step="1" value="1" required />
        </label>
        <label>Price per item (₹)
          <input name="price" type="number" min="0" step="1" placeholder="e.g. 70" required />
        </label>
        <button type="submit">Place order</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const body = document.getElementById('orders-body');
    const count = document.getElementById('count');
    const form = document.getElementById('order-form');
    const message = document.getElementById('message');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadOrders() {
      try {
        const res = await fetch('/orders');
        if (!res.ok) throw new Error('Server returned ' + res.status);
        const orders = await res.json();

        count.textContent = orders.length + (orders.length === 1 ? ' order' : ' orders');
        if (orders.length === 0) {
          body.innerHTML = '<tr><td colspan="7" class="empty">No orders yet. Add the first one below.</td></tr>';
          return;
        }
        body.innerHTML = orders.map((o) => `
          <tr>
            <td>${o.id}</td>
            <td>${escapeHtml(o.customer)}</td>
            <td>${escapeHtml(o.item)}</td>
            <td class="num">${o.quantity}</td>
            <td class="num">₹${o.price}</td>
            <td class="num">₹${o.quantity * o.price}</td>
            <td><span class="chip ${escapeHtml(o.status)}">${escapeHtml(o.status)}</span></td>
          </tr>`).join('');
      } catch (err) {
        body.innerHTML = '<tr><td colspan="7" class="empty">Could not load orders. Is the server running?</td></tr>';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.className = 'message';
      message.textContent = '';

      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();

        if (res.status === 201) {
          message.classList.add('ok');
          message.textContent = `Order #${result.id} placed for ${result.customer}.`;
          form.reset();
          form.quantity.value = 1;
          loadOrders(); // refresh the list
        } else {
          message.classList.add('error');
          message.textContent = `${res.status}: ${result.error}`;
        }
      } catch (err) {
        message.classList.add('error');
        message.textContent = 'Could not reach the server.';
      }
    });

    loadOrders();
  </script>
</body>
</html>
