openapi: 3.0.3
info:
  title: CampusEats Order Service - Assignment 6
  version: 1.1.0
  description:
    Retry transient 429 and 503 responses after the Retry-After delay.
    Do not retry unchanged 4xx client errors.
    Retry POST /orders only with the same Idempotency-Key to avoid
    creating duplicate orders.
servers:
  - url: http://127.0.0.1:5000
paths:
  /orders:
    options:
      summary: Discover supported methods and CORS policy
      responses:
        '204':
          description: No content
          headers:
            Allow: { schema: { type: string }, example: "GET, POST, OPTIONS" }
    get:
      summary: List orders
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Accept' }
        - { name: studentId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: Matching orders
          headers:
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                type: string
                description: XML representation of the matching orders

        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '406': { $ref: '#/components/responses/Problem406' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      summary: Create an order
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Accept' }
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            enum: [ application/json ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URI of the newly created order
              schema: { type: string }
              example: /orders/1
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                type: string
                description: XML representation of the created order

        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '406': { $ref: '#/components/responses/Problem406' }
        '409': { $ref: '#/components/responses/Problem409' }
        '415': { $ref: '#/components/responses/Problem415' }
        '422':
          description: Validation failed or a business rule rejected the order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://campuseats.example.com/problems/validation-error
                title: Validation failed
                status: 422
                detail: One or more fields contain invalid values.
                errors:
                  - field: address
                    message: address is required.
                  - field: items[0].quantity
                    message: Quantity must be a positive integer.
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }
  /orders/{orderId}:
    options:
      summary: Discover supported methods
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '204':
          description: No content
          headers: { Allow: { schema: { type: string }, example: "GET, PUT, OPTIONS" } }
    get:
      summary: Get one order
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Accept' }
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: Order representation
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '304': { description: Not modified }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '406': { $ref: '#/components/responses/Problem406' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

    put:
      summary: Update order status using optimistic concurrency
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Accept' }
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ status ]
              properties: { status: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: Updated order
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '415':
          $ref: '#/components/responses/Problem415'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /orders/{orderId}/cancellation:
    options:
      summary: Discover supported methods
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '204':
          description: No content
          headers: { Allow: { schema: { type: string }, example: "POST, OPTIONS" } }
    post:
      summary: Cancel an order
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Accept' }
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Order cancelled successfully
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '415':
          $ref: '#/components/responses/Problem415'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, example: "Bearer demo-token" }
    Accept:
      name: Accept
      in: header
      required: false
      schema: { type: string, example: application/json }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    OrderStatus:
      type: string
      enum: [ PENDING, CONFIRMED, CANCELLED, COMPLETED ]
    CreateOrderRequest:
      type: object
      required: [ studentId, address, items, paymentMethod ]
      properties:
        studentId: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [ itemId, quantity, unitPrice ]
            properties:
              itemId: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }
              unitPrice: { type: number, minimum: 0 }
        paymentMethod: { type: string }
    Order:
      type: object
      required: [ orderId, status, total, estimatedReadyMinutes ]
      properties:
        orderId: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { type: number }
        estimatedReadyMinutes: { type: integer }
    Problem:
      type: object
      required: [ type, title, status, detail ]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI. The final path segment identifies one of the documented problem categories.
          example: https://campuseats.example.com/problems/empty-cart
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        errors:
          type: array
          description: Field-level validation errors, when applicable.
          items:
            type: object
            required: [ field, message ]
            properties:
              field: { type: string }
              message: { type: string }

    StableErrorTypeCatalogue:
      type: object
      description: >
        Catalogue of the five stable error types required by
        the CampusEats assignment. This is documentation only
        and does not restrict other Problem Details types
        returned by the API.
      properties:
        stableTypes:
          type: array
          description: Required stable error type identifiers.
          items:
            type: string
            enum:
              - empty-cart
              - item-unavailable
              - payment-declined
              - order-not-found
              - illegal-transition
          example:
            - empty-cart
            - item-unavailable
            - payment-declined
            - order-not-found
            - illegal-transition

  responses:
    Problem400: { description: Bad request, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem401: { description: Unauthorized, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem404: { description: Not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem406: { description: Not acceptable, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem409: { description: Conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem412: { description: Precondition failed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem415: { description: Request body must use application/json, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem422: { description: Unprocessable entity, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem429: { description: Too many requests, headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem500: { description: Unexpected internal server error, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem503: { description: Payment unavailable, headers: { Retry-After: { description: Seconds to wait before retrying., schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

